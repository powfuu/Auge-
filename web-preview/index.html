  .icon-btn { position:relative; }

  /* In-app push banner */

  .toast { position:absolute; left:10px; right:10px; bottom:12px; z-index:36; display:flex; align-items:center; gap:12px; padding:10px 14px 10px 10px;
           border-radius:16px; background:color-mix(in srgb, var(--fg) 8%, var(--bg)); color:var(--fg); border:1px solid var(--border);
           backdrop-filter:blur(20px) saturate(1.5); -webkit-backdrop-filter:blur(20px) saturate(1.5);
           font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.25); transform:translateY(160%); opacity:0;

  /* Device switcher (preview only) */

  body { padding-top:64px; }

            text-align:left; cursor:pointer; font-family:inherit; transition:background .2s, color .2s, transform .15s; }

  /* Photos */

  /* Anillo de auge: the arc length is the heat index; hot ones (≥90) breathe. */

  .tile .tile-tag { margin-top:auto; }

  /* Feed post (X style) */

  /* Share sheet */

  .burst { position:absolute; left:var(--x); top:var(--y); width:0; height:0; pointer-events:none; z-index:20; }

  .ring { isolation:isolate; }

  /* Audio summary button, top-right */

  .pl-info { flex:1; min-width:0; margin-left:8px; text-align:left; border:none; background:none; color:var(--fg); font-family:inherit; cursor:pointer; padding:0; }
  .pl-kicker { display:block; font-size:10px; font-weight:700; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; }
  .pl-title { display:block; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-btn { width:34px; height:34px; flex-shrink:0; border:none; border-radius:50%; background:none; color:var(--fg); display:grid; place-items:center; cursor:pointer; transition:transform .15s, background .2s; }
  .pl-btn:hover { background:var(--line); }
  .pl-btn:active { transform:scale(.88); }
  .pl-btn svg { width:16px; height:16px; }
  .pl-main { width:38px; height:38px; background:var(--fg); color:var(--bg); }
  .pl-main:hover { background:var(--fg); }
  .pl-main svg { width:18px; height:18px; }
  .pl-x { color:var(--muted); }
  .pl-x svg { width:14px; height:14px; }
  .listen-story { margin:12px 0 4px; }
  /* Story top bar pills */
  .topbar { gap:8px; }
  .pill[data-follow], .pill-listen { display:inline-flex; align-items:center; gap:6px; }
  .pill[data-follow] svg { width:15px; height:15px; }
  .pill[data-follow].on svg { color:#ff3b30; }
  .pill-listen { background:none; color:var(--fg); border:1px solid var(--border); padding:8px 14px 8px 12px; }
  .pill-listen svg { width:12px; height:12px; color:#ff3b30; }
  /* Listen buttons: the play icon beats and a soft red ring breathes around the pill */
  .listen, .pill-listen { position:relative; }
  .listen::after, .pill-listen::after { content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none;
                                        box-shadow:0 0 0 0 rgba(255,59,48,0); }
  /* Only on tap: one beat of the play icon and one ring */
  .tapped svg { animation:listen-beat .6s ease-in-out; }
  .tapped::after { animation:listen-ring .7s ease-out; }
  @keyframes listen-ring { 0% { box-shadow:0 0 0 0 rgba(255,59,48,.45); } 60%, 100% { box-shadow:0 0 0 7px rgba(255,59,48,0); } }
  @keyframes listen-beat { 0%, 100% { transform:scale(1); } 25% { transform:scale(1.4); } 50% { transform:scale(.9); } 75% { transform:scale(1.15); } }
  .listen, .pill-listen { transition:opacity .3s, transform .35s cubic-bezier(.16,1,.3,1), max-width .35s, padding .35s, margin .35s, border-width .35s; }
  .is-hidden-listen { opacity:0; transform:scale(.6); pointer-events:none; }
  .pill-listen.is-hidden-listen { max-width:0; padding-left:0; padding-right:0; margin-left:-8px; border-width:0; overflow:hidden; }
  .cat-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px; }
  .cat-row .cat { margin:0; }
  /* Make the beat actually visible: animate the svg box itself */
  .listen svg, .pill-listen svg { display:block; transform-box:fill-box; transform-origin:50% 50%; }
  /* Hide/show slowly and smoothly */
  .listen, .pill-listen { transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1), filter .6s ease; }
  .is-hidden-listen { opacity:0; transform:translateY(-4px) scale(.85); filter:blur(2px); pointer-events:none; }
  .feed-more { display:grid; place-items:center; padding:28px 0 40px; }
  .feed-more .end { margin:0; }
  /* Ring without photo: the heat itself is the face */
  .ring .ring-face { width:100%; height:100%; border-radius:50%; border:2.5px solid var(--bg); box-sizing:border-box;
                     background:color-mix(in srgb, currentColor 12%, var(--bg)); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .ring-face b { font-size:16px; font-weight:900; letter-spacing:-.5px; }
  .ring-face small { font-size:7px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin-top:1px; opacity:.8; }
  .ring-face svg { width:45%; height:45%; }
  .ring:has(.ring-face)::before { display:none; }
  .feed-more .sheet-spinner { opacity:.35; transition:opacity .3s, transform .3s; transform:scale(.8); }
  .feed-more.loading .sheet-spinner, #grid-more .sheet-spinner { opacity:1; transform:none; }
  /* No photo: no circle at all. The feed shows the rank as a big quiet number; the grid just the index. */
  /* No photo: the rank in the same bubble as the photo badge, with a heat line underneath */
  .rank-big { display:none; grid-column:1; grid-row:1; align-self:start; justify-self:center; padding-top:6px; width:40px; }
  .rank-big b { display:grid; place-items:center; min-width:30px; height:24px; margin:0 auto; padding:0 7px; border-radius:12px; background:var(--fg); color:var(--bg); font-size:12px; font-weight:800; width:max-content; }
  .rank-big i { display:block; height:3px; margin:7px auto 0; width:30px; border-radius:2px; background:linear-gradient(90deg,#ff3b30,#ff9500) 0 0 / var(--h) 100% no-repeat, var(--line); }
  .ring:has(.ring-gone) { display:none; }
  .post-card:has(.ring-gone) .rank-chip { display:none; }
  .post-card:has(.ring-gone) .rank-big { display:block; animation:rise .6s cubic-bezier(.16,1,.3,1) both; }
</style>
</head>
<body>
<div class="devices" id="devices">
  <button data-device="phone" class="on">Móvil</button>
  <button data-device="tablet">Tablet</button>
  <button data-device="duo">Doble pantalla</button>
  <select id="edition" aria-label="Edición">
    <option value="es">Español</option><option value="en">English</option><option value="de">Deutsch</option>
    <option value="fr">Français</option><option value="pt">Português</option><option value="it">Italiano</option>
    <option value="ja">日本語</option><option value="zh">中文</option><option value="ko">한국어</option>
  </select>
</div>
<div class="phone" id="phone"><div class="stage-area" id="stage"></div><nav class="tabbar" id="tabbar"></nav></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ptrGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9500"/><stop offset="1" stop-color="#ff3b30"/></linearGradient></defs></svg>
<script>
const LABELS = { confirmed:'Confirmado', developing:'En desarrollo', uncertain:'Incierto' };
const CATEGORIES = [['politica','Política'],['conflictos','Conflictos'],['economia','Economía'],['sucesos','Sucesos'],['sociedad','Sociedad'],['tecnologia','Tecnología'],['deportes','Deportes']];
const catLabel = id => (CATEGORIES.find(c => c[0] === id) || [, id])[1];
const TOGGLES = [
  ['notifyFollowed', 'Auges que sigo', 'Cuando algo cambie o se confirme.'],
  ['notifyBreaking', 'Última hora', 'Solo lo más importante del mundo.'],
  ['notifyDigest', 'Resumen diario', 'Cada mañana, el mundo en 30 segundos.'],
  ['quietHours', 'No molestar de noche', 'Sin avisos de 23:00 a 08:00.'],
];
const TOP = 7;
const store = {
  get(k, def) { try { return JSON.parse(localStorage.getItem('auge-' + k)) ?? def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem('auge-' + k, JSON.stringify(v)); } catch {} },
};
const prefs = { categories: [], notifyFollowed: true, notifyBreaking: true, notifyDigest: false, quietHours: true, ...store.get('prefs', {}) };
const followed = new Set(store.get('followed', []));
const inbox = [];
let STORIES = [];

// Photos: the cover first, then every attached photo. Served through the image proxy because some
// outlets block hot-linking (CORP); if one fails the <img> moves on to the next, and only shows the
// blank placeholder when none load.
const photoList = s => [...new Set([s.image, ...(s.media || []).filter(m => m.type === 'image').map(m => m.url)].filter(Boolean))];
const viaProxy = url => `https://yypfwoviqsaijircsyxp.supabase.co/functions/v1/img-proxy?url=${encodeURIComponent(url)}`;
function nextPhoto(img) {
  const rest = JSON.parse(img.dataset.alts || '[]');
  if (!rest.length) { img.dispatchEvent(new Event('allfailed')); img.outerHTML = img.dataset.blank || ''; return; }
  img.dataset.alts = JSON.stringify(rest.slice(1));
  img.src = viaProxy(rest[0]);
}
/** What the ring shows when a story has no photo (or none loads): its heat number, or a flame in the grid. */
const heatColor = h => h >= 75 ? '#ff3b30' : h >= 50 ? '#ff9500' : 'var(--fg)';
const ringFace = (s, flame = false) => flame
  ? `<div class="ring-face" style="color:${heatColor(s.heat)}">${icon('auge', true)}</div>`
  : `<div class="ring-face" style="color:${heatColor(s.heat)}"><b>${s.heat}</b><small>auge</small></div>`;
const photoTag = (s, attrs, blank) => {
  const list = photoList(s);
  if (!list.length) return blank;
  return `<img src="${viaProxy(list[0])}" onload="this.classList.add('ok')" data-alts='${JSON.stringify(list.slice(1)).replace(/'/g, '&#39;')}' data-blank='${blank.replace(/'/g, '&#39;')}' ${attrs} onerror="nextPhoto(this)">`;
};
// Edition: saved choice, else the browser language (English for languages we don't cover yet).
const EDITION_IDS = ['es', 'en', 'de', 'fr', 'pt', 'it', 'ja', 'zh', 'ko'];
let edition = store.get('edition', null) || (EDITION_IDS.includes(navigator.language.slice(0, 2)) ? navigator.language.slice(0, 2) : 'en');
let device = 'phone';
let selected = null;
const timeAgo = d => { const m = Math.round((Date.now() - d) / 60000); return m < 60 ? `${m} min` : `${Math.round(m / 60)} h`; };
const phone = document.getElementById('phone');
const stageEl = document.getElementById('stage');
const d = ms => `style="animation-delay:${ms}ms"`;
const byId = id => STORIES.find(s => s.id === id) ?? older.find(s => s.id === id);
// One feed per language: everything in Spanish together, everything in English together… ranked only by heat.
const PAGE = 15;
const FIRST = 7;           // the 7 main auges, then pages of PAGE
let feedShown = FIRST;
let older = [];            // past auges loaded on demand
let olderDone = false;
let olderOffset = 0;       // rows read from the database so far (kept or not)
let loadingMore = false;
/** Same event re-clustered on another day: keep only the first (newest) version. */
const storyKey = s => s.tag.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(' ').slice(0, 6).join(' ');
const uniqueStories = list => { const seen = new Set(); return list.filter(s => { const k = storyKey(s); if (seen.has(k)) return false; seen.add(k); return true; }); };
/** Everything the infinite feed can show: today's auges (hottest first), then older ones. */
const feedPool = () => uniqueStories([...STORIES, ...older]).filter(s => !prefs.categories.length || prefs.categories.includes(s.category));
const topStories = () => STORIES.filter(s => !prefs.categories.length || prefs.categories.includes(s.category)).slice(0, TOP);
const wide = () => device !== 'phone';

let dark = store.get('theme', null) ? store.get('theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const applyTheme = () => phone.classList.toggle('dark', dark);

// Notifications: inbox + in-app banner standing in for the OS push.
let toastTimer;
function notify(title, body, storyId) {
  inbox.unshift({ title, body, storyId, at: new Date(), read: false });
  refreshBell();
  const h = new Date().getHours();
  if (prefs.quietHours && (h >= 23 || h < 8)) return;
  let t = phone.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; stageEl.appendChild(t); }
  const story = storyId ? byId(storyId) : null;
  const thumb = story && photoList(story).length ? photoTag(story, 'alt=""', '<div class="toast-dot">' + icon('auge', true) + '</div>') : '<div class="toast-dot">' + icon('auge', true) + '</div>';
  t.innerHTML = `${thumb}<div class="toast-text"><b>${title}</b><span>${body}</span></div>`;
  t.onclick = () => { t.classList.remove('show'); if (storyId) openStory(storyId); };
  // Sit above the tab bar and the mini player when they're on screen.
  t.classList.toggle('raised', !document.getElementById('tabbar').classList.contains('hidden'));
  t.classList.toggle('above-player', !!player.open);
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
const unread = () => inbox.filter(i => !i.read).length;
const refreshBell = () => document.getElementById('tabbar') && renderTabs();

function toggleFollow(id) {
  if (followed.has(id)) followed.delete(id);
  else {
    followed.add(id);
    const s = byId(id);
    const pending = s.facts.filter(f => f.certainty !== 'confirmed').length;
    if (prefs.notifyFollowed) notify(`Sigues Auge · #${s.tag}`, pending ? `Te avisaremos de ${pending} punto${pending > 1 ? 's' : ''} aún sin confirmar.` : 'Te avisaremos si hay cambios importantes.', id);
  }
  store.set('followed', [...followed]);
}

// Minimal page stack mirroring the app's router with slide transitions.
const stack = [];
function push(render) {
  const v = document.createElement('div');
  v.className = 'view';
  v.render = render;
  render(v);
  stageEl.appendChild(v);
  stack.at(-1)?.classList.replace('current', 'under');
  stack.push(v);
  requestAnimationFrame(() => requestAnimationFrame(() => v.classList.add('current')));
  renderTabs();
}
function pop() {
  if (stack.length < 2) return;
  const v = stack.pop();
  v.classList.remove('current');
  const t = stack.at(-1);
  t.render(t);  // refresh (e.g. follow count changed)
  t.classList.replace('under', 'current');
  setTimeout(() => v.remove(), 400);
  renderTabs();
}
function reset(root = feedView) {
  stack.splice(0).forEach(v => v.remove());
  push(root);
  renderTabs();
}

// Bottom tab bar: the five root screens. Detail screens hide it.
// Thin outline icons like X's tab bar (Lucide paths, ISC). Idle: 1.75 stroke. Active: filled, or bolder when not fillable.
const ICON_PATHS = {
  auge: [['M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z'], true],
  explore: [['M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z', 'm21 21-4.3-4.3'], false],
  following: [['m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z'], true],
  alerts: [['M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9', 'M10.3 21a1.94 1.94 0 0 0 3.4 0'], true],
  person: [['M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2', 'M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'], true],
};
const icon = (name, active = false) => { const [d, fillable] = ICON_PATHS[name];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${active && !fillable ? 2.6 : 1.75}" stroke-linecap="round" stroke-linejoin="round">${d.map((p, i) => `<path d="${p}" fill="${active && fillable && i === 0 ? 'currentColor' : 'none'}"/>`).join('')}</svg>`; };
const ICONS = { auge: icon('auge', true) };
const NEWS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13a1 1 0 0 1 1 1v13a1 1 0 0 0 2 0V9"/><path d="M4 5v13a2 2 0 0 0 2 2h14"/><path d="M8 9h6M8 13h6M8 17h3"/></svg>';
const SHARE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>';
const TABS = [['auge', () => feedView], ['explore', () => exploreView], ['following', () => followingView], ['alerts', () => notificationsView], ['person', () => profileView]];
let tab = 'auge';
function renderTabs() {
  const bar = document.getElementById('tabbar');
  bar.classList.toggle('hidden', stack.length > 1);
  phone.querySelector('.player')?.classList.toggle('raised', stack.length <= 1);
  bar.innerHTML = TABS.map(([id]) => `<button data-tab="${id}" class="${tab === id ? 'on' : ''}" aria-label="${id}">
    ${id === 'person' && user ? avatar(user.avatarId, 21) : icon(id, tab === id)}${id === 'alerts' && unread() ? '<span class="tab-dot"></span>' : ''}</button>`).join('');
  bar.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    // Tapping the tab you are on scrolls it back to the top, smoothly (like X).
    if (b.dataset.tab === tab && stack.length === 1) { stack[0].scrollTo({ top: 0, behavior: 'smooth' }); return; }
    tab = b.dataset.tab;
    reset(TABS.find(t => t[0] === tab)[1]());
  });
}
function openStory(id) {
  push(storyView(id));
}
const topbar = (title = '', right = '', back = true) => `
  <div class="topbar">${back ? '<button class="icon-btn" data-back>←</button>' : ''}${title ? `<div class="topbar-title">${title}</div>` : ''}${right}</div>`;
const wire = v => {
  v.querySelectorAll('[data-back]').forEach(b => b.onclick = pop);
  v.querySelectorAll('[data-story]').forEach(b => b.onclick = () => openStory(b.dataset.story));
};
const factsHtml = (facts, base) => facts.map((f, i) => `
  <div class="fact rise" ${d(base + i * 80)}><div class="bar ${f.certainty}"></div>
    <div><div class="badge ${f.certainty}">${LABELS[f.certainty]}</div><p>${f.text}</p></div></div>`).join('');
const sourcesHtml = (sources, base) => sources.map((s, i) =>
  `<a class="source rise" ${d(base + i * 60)} href="${s.url}" target="_blank" rel="noopener">${s.name}<span>↗</span></a>`).join('');
const socialHtml = (s, base) => `
  ${s.pulse ? `<div class="section rise" ${d(base - 40)}>PULSO EN REDES</div>
  <div class="pulse-mood rise" ${d(base - 20)}>${s.pulse.mood}</div>` : ''}
  ${(s.pulse?.networks || []).map((n, i) => `<div class="pulse-row rise" ${d(base + i * 40)}><span class="pulse-name">${n.name}</span><div class="track"><div class="fill" style="width:${n.volume}%;animation-delay:${base + 80 + i * 60}ms"></div></div><span class="pulse-val">${n.volume}</span></div>`).join('')}
  ${s.topics.length ? `<div class="section rise" ${d(base)}>EN REDES</div>
  <div class="chips rise" ${d(base + 20)}>${s.topics.map(t => `<button class="chip tag-chip" data-tag="${t.replace(/^#/, '')}">${t}</button>`).join('')}</div>
  <div class="tag-hint">Toca un hashtag para verlo en X, Instagram, TikTok o Facebook.</div>` : ''}`;

// Open a hashtag on the chosen network (web or app via universal links). We link out; we're not the network.
const TAG_NETS = [
  ['X', '#000', '<path d="M4 4l16 16M20 4L4 20"/>', t => `https://x.com/hashtag/${encodeURIComponent(t)}`],
  ['Instagram', '#E1306C', '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>', t => `https://www.instagram.com/explore/tags/${encodeURIComponent(t.toLowerCase())}/`],
  ['TikTok', '#111', '<path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c.5 3 2.5 5 6 5"/>', t => `https://www.tiktok.com/tag/${encodeURIComponent(t.toLowerCase())}`],
  ['Facebook', '#1877F2', '<path d="M15 3h-3a4 4 0 0 0-4 4v3H5v4h3v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>', t => `https://www.facebook.com/hashtag/${encodeURIComponent(t.toLowerCase())}`],
];
/** Celebration when following: sparks + ripple from the button's icon, and a springy pop. */
function followBurst(btn, on) {
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  if (!on) return;
  const host = btn.closest('.view') || stageEl;
  const r = btn.getBoundingClientRect(), hr = host.getBoundingClientRect();
  const icon = btn.querySelector('svg')?.getBoundingClientRect() ?? r;
  const burst = document.createElement('div');
  burst.className = 'burst';
  burst.style.setProperty('--x', `${icon.left - hr.left + icon.width / 2 + host.scrollLeft}px`);
  burst.style.setProperty('--y', `${icon.top - hr.top + icon.height / 2 + host.scrollTop}px`);
  const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#ff3b30', '#ff6a3d'];
  burst.innerHTML = '<b></b>' + Array.from({ length: 12 }, (_, i) =>
    `<i class="${i % 2 ? 'dash' : ''}" style="--a:${i * 30 + Math.random() * 10}deg;--d:-${22 + Math.random() * 14}px;--c:${colors[i % colors.length]};animation-delay:${Math.random() * 60}ms"></i>`).join('');
  host.appendChild(burst);
  setTimeout(() => burst.remove(), 900);
  navigator.vibrate?.(12);
}

function openTag(tag) {
  stageEl.querySelector('.share-sheet')?.remove();
  const sheet = document.createElement('div');
  sheet.className = 'share-sheet tag-sheet';
  sheet.innerHTML = `<div class="sheet-backdrop"></div><div class="sheet"><div class="sheet-grip"></div>
    <div class="sheet-title">#${tag}<small>Ver la conversación en</small></div>
    <div class="sheet-nets">${TAG_NETS.map(([n, c, p], i) => `<button data-i="${i}"><span style="background:${c}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg></span>${n}</button>`).join('')}</div></div>`;
  stageEl.appendChild(sheet);
  requestAnimationFrame(() => sheet.classList.add('show'));
  const close = () => { sheet.classList.remove('show'); setTimeout(() => sheet.remove(), 350); };
  sheetBehaviour(sheet, close);
  sheet.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { open(TAG_NETS[+b.dataset.i][3](tag), '_blank', 'noopener'); close(); });
}

const BOOKMARK = '<svg class="followed-badge" viewBox="0 0 24 24" fill="currentColor" aria-label="Siguiendo"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2z"/></svg>';
const badge = id => followed.has(id) ? BOOKMARK : '';
const VERDICTS = { contradicted:'Falso', unproven:'Sin pruebas', consistent:'Coincide' };
const lastVisit = new Date(store.get('lastVisit', Date.now() - 6 * 3600000));
store.set('lastVisit', Date.now());
let showChanges = true;
const changes = () => STORIES.flatMap(s => s.timeline.filter(t => t.at > lastVisit).map(t => ({ story: s, ...t }))).sort((a, b) => b.at - a.at);

const mediaHtml = (s, base) => s.media.length ? `
  <div class="section rise" ${d(base)}>FOTOS Y VÍDEOS · ${s.media.length}</div>
  <div class="gallery rise" ${d(base + 20)}>${s.media.map((m, i) => m.type === 'image'

      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = 1; el.style.transform = ''; })); }, 160);
  };

  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); };

/** Best voice for a language: prefer natural/neural/Google voices, then any local match. */
function pickVoice(lang) {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang.slice(0, 2)));
  const exact = voices.filter(v => v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase());
  const pool = exact.length ? exact : voices;
  return pool.find(v => /natural|neural|premium|enhanced/i.test(v.name)) ?? pool.find(v => /google/i.test(v.name)) ?? pool[0] ?? null;
}

/** Escuchar auge: the story as it reads on screen — headline, brief, the report with certainty, the timeline. */
function startStory(s) {
  const L = SPOKEN[edition] ?? SPOKEN.es;
  const lines = [
    s.tag.replace(/^#/, ''),
    s.brief,
    ...s.facts.map((x, i) => `${i === 0 ? L.report + ' ' : ''}${L[x.certainty]}: ${x.text}`),
    ...(s.timeline || []).map((t, i) => `${i === 0 ? L.timeline + ' ' : ''}${spokenAgo(t.at, L)}: ${t.text}`),
  ].filter((x, i, all) => x && all.indexOf(x) === i);
  player.queue = lines;
  player.ids = lines.map(() => s.id);
  player.kicker = 'Escuchar auge';
  player.hasIntro = false;
  player.open = true;
  playAt(0);

/** Speak one line; when it ends, move to the next. A token cancels stale callbacks after seeks. */
function playAt(i) {
  const cfg = BRIEF[edition] ?? BRIEF.en;
  const token = ++player.token;
  speechSynthesis.cancel();
  if (i >= player.queue.length) { player.playing = false; player.index = player.queue.length - 1; player.done = true; renderPlayer(); return; }
  player.index = Math.max(0, i); player.playing = true; player.done = false;
  const u = new SpeechSynthesisUtterance(player.queue[player.index]);
  u.lang = cfg.voice; const v = pickVoice(cfg.voice); if (v) u.voice = v;
  u.onstart = () => token === player.token && setTalking(true);
  u.onend = () => { if (token !== player.token) return; setTalking(false); if (player.playing) playAt(player.index + 1); };
  speechSynthesis.speak(u);
  renderPlayer();
}

const imgProxy = src => `${SUPABASE_URL}/functions/v1/img-proxy?url=${encodeURIComponent(src)}`;
const SHARE_FORMATS = { story: { w: 1080, h: 1920, label: 'Story' }, post: { w: 1080, h: 1350, label: 'Post' } };
const CERT_COLORS = { confirmed: '#22c55e', developing: '#f59e0b', uncertain: '#a3a3a3' };

const loadImg = src => new Promise(res => {
  if (!src) return res(null);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => res(img);
  img.onerror = () => res(null);
  img.src = imgProxy(src);

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/** Wraps text into at most `max` lines, ending with … if cut. Returns the y after the last line. */
function wrapText(g, text, x, y, width, lh, max) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > width && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  const out = lines.slice(0, max);
  if (lines.length > max) {
    let last = out[max - 1];
    while (g.measureText(last + '…').width > width && last.includes(' ')) last = last.slice(0, last.lastIndexOf(' '));
    out[max - 1] = last.replace(/[,.;:]$/, '') + '…';
  }
  out.forEach((l, i) => g.fillText(l, x, y + i * lh));
  return y + (out.length - 1) * lh;
}

/**
 * Share card, editorial poster style: full-bleed photo,
 * the story set on a gradient at the bottom, and a brand-colour strip. Same layout in dark or light.
 */
async function renderCard(s, format, theme = 'dark') {
  const T = theme === 'dark'
    ? { bg: '#050505', rgb: '5,5,5', fg: '#ffffff', sub: 'rgba(255,255,255,.78)', muted: 'rgba(255,255,255,.55)', track: 'rgba(255,255,255,.18)', edge: 'rgba(255,255,255,.14)', chip: 'rgba(255,255,255,.14)' }
    : { bg: '#ffffff', rgb: '255,255,255', fg: '#0a0a0a', sub: 'rgba(10,10,10,.78)', muted: 'rgba(10,10,10,.5)', track: 'rgba(10,10,10,.12)', edge: 'rgba(10,10,10,.1)', chip: 'rgba(10,10,10,.08)' };
  const { w: W, h: H } = SHARE_FORMATS[format];
  const story = format === 'story';
  await document.fonts?.ready;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const font = (wt, px) => `${wt} ${px}px -apple-system, "SF Pro Display", "Segoe UI", Inter, Roboto, sans-serif`;
  const M = 72;
  const photo = await loadImg(s.media?.find(m => m.type === 'image')?.url || s.image);

  // 1. Full-bleed photo (or a warm gradient if there's none).
  g.fillStyle = T.bg; g.fillRect(0, 0, W, H);
  if (photo) {
    const scale = Math.max(W / photo.width, (H * 0.56) / photo.height);
    const iw = photo.width * scale, ih = photo.height * scale;
    g.drawImage(photo, (W - iw) / 2, 0, iw, ih);
  } else {
    const fb = g.createLinearGradient(0, 0, W, H * 0.7);
    fb.addColorStop(0, '#ff3b30'); fb.addColorStop(1, '#ff9500');
    g.fillStyle = fb; g.fillRect(0, 0, W, H * 0.5);
  }
  // Fade the photo into the page colour; a light top scrim keeps the logo readable.
  const top = g.createLinearGradient(0, 0, 0, 320);
  top.addColorStop(0, 'rgba(0,0,0,.55)'); top.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = top; g.fillRect(0, 0, W, 320);
  const fadeStart = H * (story ? 0.17 : 0.12);
  const fade = g.createLinearGradient(0, fadeStart, 0, H * (story ? 0.48 : 0.44));
  fade.addColorStop(0, `rgba(${T.rgb},0)`); fade.addColorStop(0.55, `rgba(${T.rgb},.82)`); fade.addColorStop(1, `rgba(${T.rgb},1)`);
  g.fillStyle = fade; g.fillRect(0, fadeStart, W, H - fadeStart);

  // 3. Header: logo (white on the photo) + date pill.
  let y = story ? 140 : 100;
  g.font = font(900, 62);
  g.fillStyle = '#fff'; g.fillText('Auge', M, y);
  const lw = g.measureText('Auge').width;
  const bang = g.createLinearGradient(0, y - 58, 0, y);
  bang.addColorStop(0, '#ff9500'); bang.addColorStop(1, '#ff3b30');
  g.fillStyle = bang; g.fillText('!', M + lw + 2, y);
  const date = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).toUpperCase().replace('.', '');
  g.font = font(800, 22);
  const dw = g.measureText(date).width + 36;
  g.fillStyle = 'rgba(0,0,0,.45)'; roundRect(g, W - M - dw, y - 42, dw, 46, 23); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'right'; g.fillText(date, W - M - 18, y - 11); g.textAlign = 'left';
  if (photo && s.media?.[0]) {
    g.font = font(600, 18); g.fillStyle = 'rgba(255,255,255,.7)';
    g.fillText('Foto: ' + s.media[0].credit, M, y + 44);
  }

  // 4. Bottom block, laid out upwards from the footer so long headlines never collide.
  const footer = H - (story ? 110 : 70);
  // Category chip + ring row.
  const rC = story ? 58 : 50;
  let by = H * (story ? 0.5 : 0.45);
  const rx = M + rC, ry = by;
  g.fillStyle = T.bg; g.beginPath(); g.arc(rx, ry, rC + 10, 0, Math.PI * 2); g.fill();
  g.lineWidth = 6; g.lineCap = 'round';
  g.strokeStyle = T.track; g.beginPath(); g.arc(rx, ry, rC, 0, Math.PI * 2); g.stroke();
  const arc = g.createLinearGradient(rx - rC, ry - rC, rx + rC, ry + rC);
  arc.addColorStop(0, '#ff3b30'); arc.addColorStop(1, '#ff9500');
  g.strokeStyle = arc; g.beginPath(); g.arc(rx, ry, rC, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * s.heat / 100); g.stroke();
  g.textAlign = 'center'; g.fillStyle = T.fg; g.font = font(900, story ? 46 : 40);
  g.fillText(String(s.heat), rx, ry + (story ? 12 : 10));
  g.fillStyle = '#ff6a3d'; g.font = font(800, 14); g.fillText('AUGE', rx, ry + (story ? 36 : 32));
  g.textAlign = 'left';
  const cat = catLabel(s.category).toUpperCase();
  g.font = font(800, 22);
  const cw = g.measureText(cat).width + 40;
  g.fillStyle = T.chip; roundRect(g, rx + rC + 28, ry - 44, cw, 46, 23); g.fill();
  g.fillStyle = T.fg; g.fillText(cat, rx + rC + 48, ry - 13);
  g.fillStyle = T.muted; g.font = font(600, 24);
  g.fillText(`${s.region} · ${s.sources.length} medios`, rx + rC + 30, ry + 32);

  // Headline + brief.
  by = ry + rC + (story ? 100 : 82);
  g.fillStyle = T.fg; g.font = font(900, story ? 74 : 58);
  by = wrapText(g, '#' + s.tag, M, by, W - M * 2, story ? 84 : 66, story ? 4 : 3);
  g.fillStyle = T.sub; g.font = font(400, story ? 36 : 30);
  by = wrapText(g, s.brief, M, by + (story ? 70 : 54), W - M * 2, story ? 50 : 42, story ? 3 : 2);

  // Certainty dots.
  const counts = ['confirmed', 'developing', 'uncertain'].map(k => [k, s.facts.filter(f => f.certainty === k).length]).filter(([, n]) => n);
  const names = { confirmed: 'confirmado', developing: 'en desarrollo', uncertain: 'incierto' };
  let x = M;
  by += story ? 76 : 58;
  g.font = font(700, 25);
  if (by < footer - 70) for (const [k, n] of counts) {
    g.fillStyle = CERT_COLORS[k]; g.beginPath(); g.arc(x + 9, by - 9, 9, 0, Math.PI * 2); g.fill();
    g.fillStyle = T.sub;
    const label = `${n} ${names[k]}`;
    g.fillText(label, x + 28, by);
    x += 28 + g.measureText(label).width + 34;
  }

  // 5. Footer.
  // Who reported it (credibility) on the left, the brand mark on the right.
  const srcNames = s.sources.map((x) => x.name);
  const srcLine = srcNames.length > 2 ? `${srcNames.slice(0, 2).join(', ')} y ${srcNames.length - 2} más` : srcNames.join(' y ');
  g.fillStyle = T.muted; g.font = font(600, 20);
  g.fillText('CONTADO POR', M, footer - 34);
  g.fillStyle = T.fg; g.font = font(700, 28);
  wrapText(g, srcLine, M, footer, W - M * 2 - 220, 34, 1);
  g.textAlign = 'right'; g.font = font(900, 44);
  const bw = g.measureText('!').width;
  const fb = g.createLinearGradient(0, footer - 40, 0, footer);
  fb.addColorStop(0, '#ff9500'); fb.addColorStop(1, '#ff3b30');
  g.fillStyle = fb; g.fillText('!', W - M, footer);
  g.fillStyle = T.fg; g.fillText('Auge', W - M - bw - 2, footer);
  g.textAlign = 'left';

  return c;
}

/** Close button + swipe-down-to-dismiss for any bottom sheet. */
const CLOSE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function sheetBehaviour(wrapper, close) {
  const sheet = wrapper.querySelector('.sheet');
  sheet.insertAdjacentHTML('afterbegin', `<button class="sheet-close" aria-label="Cerrar">${CLOSE_ICON}</button>`);
  sheet.querySelector('.sheet-close').onclick = close;
  wrapper.querySelector('.sheet-backdrop').onclick = close;
  const handle = sheet.querySelector('.sheet-grip');
  const title = sheet.querySelector('.sheet-title');
  [handle, title].forEach((el) => el && el.classList.add('sheet-drag'));
  let startY = null, dy = 0;
  const onDown = (e) => { startY = e.clientY; dy = 0; sheet.classList.add('dragging'); sheet.setPointerCapture?.(e.pointerId); };
  const onMove = (e) => {
    if (startY === null) return;
    dy = Math.max(0, e.clientY - startY);
    sheet.style.transform = `translateY(${dy}px)`;
    wrapper.querySelector('.sheet-backdrop').style.opacity = String(Math.max(0, 1 - dy / 400));
  };
  const onUp = () => {
    if (startY === null) return;
    startY = null;
    sheet.classList.remove('dragging');
    sheet.style.transform = '';
    wrapper.querySelector('.sheet-backdrop').style.opacity = '';
    if (dy > 110) close();
  };
  [handle, title].forEach((el) => el && el.addEventListener('pointerdown', onDown));
  sheet.addEventListener('pointermove', onMove);
  sheet.addEventListener('pointerup', onUp);
  sheet.addEventListener('pointercancel', onUp);
}

/** Bottom sheet: live preview, format switch and one tap per network. */
async function shareCard(s) {
  stageEl.querySelector('.share-sheet')?.remove();
  const sheet = document.createElement('div');
  sheet.className = 'share-sheet';
  const link = s.sources[0]?.url || location.href;
  const text = `#${s.tag} — ${s.brief}`;
  const enc = encodeURIComponent;
  const NET = [
    ['instagram', 'Instagram', '#E1306C', '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>'],
    ['tiktok', 'TikTok', '#111', '<path d="M14 3v11a4 4 0 1 1-4-4"/><path d="M14 3c.5 3 2.5 5 6 5"/>'],
    ['x', 'X', '#000', '<path d="M4 4l16 16M20 4L4 20"/>'],
    ['facebook', 'Facebook', '#1877F2', '<path d="M15 3h-3a4 4 0 0 0-4 4v3H5v4h3v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>'],
    ['whatsapp', 'WhatsApp', '#25D366', '<path d="M3 21l1.6-5A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/>'],
    ['telegram', 'Telegram', '#229ED9', '<path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/><path d="M9 13l8-6"/>'],
    ['copy', 'Copiar', '#3a3a3a', '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>'],
  ];
  sheet.innerHTML = `
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Compartir auge</div>
      <div class="sheet-switches">
        <div class="sheet-formats">${Object.entries(SHARE_FORMATS).map(([k, f]) => `<button data-format="${k}" class="${k === 'story' ? 'on' : ''}">${f.label}</button>`).join('')}</div>
        <div class="sheet-formats"><button data-theme="dark" class="${dark ? 'on' : ''}">Oscuro</button><button data-theme="light" class="${dark ? '' : 'on'}">Claro</button></div>
      </div>
      <div class="sheet-preview"><div class="sheet-spinner"></div></div>
      <button class="sheet-save" data-net="download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Guardar imagen en el dispositivo</button>
      <div class="sheet-or"><span>o</span></div>
      <div class="sheet-nets">${NET.map(([id, label, color, path]) => `<button data-net="${id}"><span style="background:${color}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg></span>${label}</button>`).join('')}</div>
    </div>`;
  stageEl.appendChild(sheet);
  requestAnimationFrame(() => sheet.classList.add('show'));
  const close = () => { sheet.classList.remove('show'); setTimeout(() => sheet.remove(), 350); };
  sheetBehaviour(sheet, close);

  let format = 'story', cardTheme = dark ? 'dark' : 'light', canvas = null;
  const preview = sheet.querySelector('.sheet-preview');
  const render = async () => {
    preview.classList.toggle('post', format === 'post');
    preview.innerHTML = '<div class="sheet-spinner"></div>';
    canvas = await renderCard(s, format, cardTheme);
    canvas.className = 'sheet-img';
    preview.innerHTML = '';
    preview.appendChild(canvas);
  };
  sheet.querySelectorAll('[data-format]').forEach(b => b.onclick = () => {
    format = b.dataset.format;
    sheet.querySelectorAll('[data-format]').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  sheet.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => {
    cardTheme = b.dataset.theme;
    sheet.querySelectorAll('[data-theme]').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  render();

  const blob = () => new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = async () => new File([await blob()], `auge-${s.id}-${format}.png`, { type: 'image/png' });
  const download = async () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await blob()); a.download = `auge-${s.id}-${format}.png`; a.click();
  };
  const nativeShare = async () => {
    const f = await file();
    if (navigator.canShare?.({ files: [f] })) { await navigator.share({ files: [f], text, url: link }); return true; }
    return false;
  };
  sheet.querySelectorAll('[data-net]').forEach(b => b.onclick = async () => {
    if (!canvas) return;
    const net = b.dataset.net;
    try {
      if (net === 'instagram' || net === 'tiktok') {
        // Instagram and TikTok have no web share URL: hand the image to the OS share sheet, or save it.
        const app = net === 'instagram' ? 'Instagram → Historia o Publicación' : 'TikTok → Crear → Subir';
        if (!(await nativeShare())) { await download(); notify('Imagen guardada', `Ábrela en ${app}.`); }
      } else if (net === 'x') open(`https://twitter.com/intent/tweet?text=${enc(text + ' vía @Auge')}&url=${enc(link)}`, '_blank');
      else if (net === 'facebook') open(`https://www.facebook.com/sharer/sharer.php?u=${enc(link)}`, '_blank');
      else if (net === 'whatsapp') open(`https://wa.me/?text=${enc(text + '\n' + link)}`, '_blank');
      else if (net === 'telegram') open(`https://t.me/share/url?url=${enc(link)}&text=${enc(text)}`, '_blank');
      else if (net === 'copy') {
        // Copy the image itself (paste straight into a chat, a post or a design app).
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob() })]);
        notify('Imagen copiada', 'Pégala donde quieras.');
      }
      else if (net === 'download') { await download(); notify('Imagen guardada', `Formato ${SHARE_FORMATS[format].label}.`); }
    } catch {}
  });
}

// Pull to refresh: drag (touch or mouse) or scroll up past the top.
let justUpdated = false;
const PULL_MAX = 110, PULL_TRIGGER = 70;
function attachPull(scroller, view) {
  const ptr = scroller.querySelector('.ptr'), ball = ptr.querySelector('.ptr-ball');
  const content = scroller.querySelector('.scroller-content'), circle = ptr.querySelector('circle');
  let startY = null, dist = 0, busy = false, wheelTimer;
  const set = px => {
    dist = Math.max(0, Math.min(PULL_MAX, px));
    const p = dist / PULL_TRIGGER;
    content.style.transform = dist ? `translateY(${dist * 0.6}px)` : '';
    ball.style.opacity = Math.min(1, p);
    ball.style.transform = `translateY(${dist * 0.9}px) rotate(${dist * 4}deg) scale(${0.6 + Math.min(p, 1) * 0.4})`;
    circle.style.strokeDashoffset = 56 - Math.min(p, 1) * 44;
  };
  const release = async () => {
    scroller.classList.remove('pulled');
    if (dist > 4) scroller.addEventListener('click', e => e.stopPropagation(), { capture: true, once: true });
    if (dist < PULL_TRIGGER || busy) return set(0);
    busy = true;
    set(PULL_TRIGGER);
    circle.style.strokeDashoffset = '';
    ptr.classList.add('spinning');
    await Promise.all([loadStories(), new Promise(r => setTimeout(r, 1100))]);
    justUpdated = true;
    view.render(view);
  };
  scroller.addEventListener('pointerdown', e => { if (scroller.scrollTop <= 0 && !busy) startY = e.clientY; });
  scroller.addEventListener('pointermove', e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    if (dy > 4) { scroller.classList.add('pulled'); set(dy * 0.55); }
  });
  addEventListener('pointerup', () => { if (startY !== null) { startY = null; release(); } });
  scroller.addEventListener('wheel', e => {
    if (scroller.scrollTop > 0 || e.deltaY >= 0 || busy) return;
    scroller.classList.add('pulled');
    set(dist - e.deltaY * 0.35);
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(release, 160);
  }, { passive: true });
}

/** Older auges of this edition (retired from the live list), newest first. */
async function fetchOlder() {
  const seen = new Set([...STORIES, ...older].map(s => s.id));
  const res = await fetch(`${SUPABASE_URL}/rest/v1/stories?select=*&active=eq.false&lang=eq.${edition}&order=updated_at.desc&limit=40&offset=${olderOffset}`, { headers: { apikey: SUPABASE_KEY } });
  const rows = res.ok ? await res.json() : [];
  olderOffset += rows.length;
  if (rows.length < 40) olderDone = true;
  older.push(...rows.filter(r => !seen.has(r.id)).map(safeStory));
}

/**
 * Infinite feed, X style: when the spinner at the bottom comes into view, wait a beat (it feels like
 * loading, not a dump), add one page that fades in, then pause briefly before the next one can load.
 */
function attachInfinite(v) {
  const sentinel = v.querySelector('#feed-more');
  if (!sentinel) return;
  const io = new IntersectionObserver(async ([entry]) => {
    if (!entry.isIntersecting || loadingMore) return;
    loadingMore = true;
    io.unobserve(sentinel);
    sentinel.classList.add('loading');
    const started = Date.now();
    if (feedShown >= feedPool().length && !olderDone) await fetchOlder();
    await new Promise(r => setTimeout(r, Math.max(0, 900 - (Date.now() - started))));
    const next = feedPool().slice(feedShown, feedShown + PAGE);
    if (next.length) {
      sentinel.insertAdjacentHTML('beforebegin', next.map((s, k) => postCard(s, feedShown + k, k * 90)).join(''));
      feedShown += next.length;
      wire(v);
      wirePostActions(v);
    }
    sentinel.classList.remove('loading');
    const done = feedShown >= feedPool().length && olderDone;
    if (done) sentinel.innerHTML = '<div class="end">Estás al día. Vuelve en un rato para más auges.</div>';
    loadingMore = false;
    if (!done) setTimeout(() => io.observe(sentinel), 600);
  }, { root: v, rootMargin: '120px' });
  io.observe(sentinel);
}

function feedView(v) {
  const firstPaint = !v.dataset.painted;
  v.dataset.painted = '1';
  const animateCards = firstPaint || justUpdated;
  v.innerHTML = feedList(firstPaint, animateCards);
  justUpdated = false;
  attachPull(v, v);
  wire(v);

  v.querySelector('#listen').onclick = e => { tapListen(e.currentTarget); startBrief(0); };
  syncListenButtons();
  wirePostActions(v);
}

function wirePostActions(v) {
  v.querySelectorAll('.post-card [data-act]').forEach(b => b.onclick = e => {
    const id = b.closest('[data-story]').dataset.story;
    if (b.dataset.act === 'open') return;
    e.stopPropagation();
    if (b.dataset.act === 'follow') {
      toggleFollow(id);
      const on = followed.has(id);
      b.classList.toggle('on', on);
      b.querySelector('span').textContent = on ? 'Siguiendo' : 'Seguir';
      followBurst(b, on);
    }
    if (b.dataset.act === 'share') shareCard(byId(id));
  });
  v.querySelector('#hide-changes')?.addEventListener('click', e => { e.stopPropagation(); showChanges = false; v.querySelector('.changes').remove(); });
  attachInfinite(v);
}

Visto en Auge!`;

let exploreCat = null;
const GRID_PAGE = 45;
let gridShown = GRID_PAGE;
const gridPool = () => uniqueStories([...STORIES, ...older]).filter(s => !exploreCat || s.category === exploreCat);

/** One square of the grid. */
function tileHtml(s, i, delay) {
  return `
        <div class="tile rise" ${d(delay)} data-story="${s.id}">${badge(s.id)}
          <div class="ring-row">
            <div class="ring ${s.heat >= 90 ? 'hot' : ''}" style="--to:${s.heat};animation-delay:${delay + 110}ms">${photoTag(s, 'alt="" loading="lazy"', '<i class="ring-gone"></i>')}</div>
            <div class="ring-num"><b style="color:${s.heat >= 75 ? '#ff3b30' : s.heat >= 50 ? '#ff9500' : 'var(--fg)'}">${s.heat}</b><span>auge</span></div>
          </div>
          <div class="tile-tag">#${s.tag}</div>
          <div class="tile-region">${s.region}</div>
        </div>`;
}

function exploreView(v) {
  gridShown = GRID_PAGE;
  const list = gridPool().slice(0, gridShown);
  v.innerHTML = `
    <div class="tab-title">Todos los auges</div>
    <div class="legend rise">${ICONS.auge}<div><b>Índice de auge, de 0 a 100</b><span>El anillo se llena según cuánto crece el tema ahora en medios y lectores. 100 = lo que más arde; los que laten están al rojo vivo.</span></div></div>
    <div class="filters"><button class="chip ${!exploreCat ? 'on' : ''}" data-cat="">Todos</button>${CATEGORIES.map(([id, label]) => `<button class="chip ${exploreCat === id ? 'on' : ''}" data-cat="${id}">${label}</button>`).join('')}</div>
    <div class="grid">
      ${list.map((s, i) => tileHtml(s, i, i * 40)).join('') || '<div class="end" style="grid-column:1/-1">Nada en auge en este tema ahora mismo.</div>'}
    </div>
    <div class="feed-more" id="grid-more"><div class="sheet-spinner"></div></div>`;
  v.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { exploreCat = b.dataset.cat || null; exploreView(v); });
  v.querySelectorAll('[data-back]').forEach(b => b.onclick = pop);
  v.querySelectorAll('[data-story]').forEach(b => b.onclick = () => push(storyView(b.dataset.story)));

  // Infinite grid.
  const sentinel = v.querySelector('#grid-more');
  const grid = v.querySelector('.grid');
  let busy = false;
  const io = new IntersectionObserver(async ([entry]) => {
    if (!entry.isIntersecting || busy) return;
    busy = true;
    io.unobserve(sentinel);
    const started = Date.now();
    if (gridShown >= gridPool().length && !olderDone) await fetchOlder();
    const next = gridPool().slice(gridShown, gridShown + GRID_PAGE);
    await new Promise(r => setTimeout(r, Math.max(0, 900 - (Date.now() - started))));
    if (next.length) {
      grid.insertAdjacentHTML('beforeend', next.map((s, k) => tileHtml(s, gridShown + k, k * 45)).join(''));
      gridShown += next.length;
      v.querySelectorAll('.grid [data-story]').forEach(b => b.onclick = () => push(storyView(b.dataset.story)));
    }
    if (gridShown >= gridPool().length && olderDone) sentinel.innerHTML = '<div class="end">Has llegado al final de lo que tenemos.</div>';
    busy = false;
    if (!(gridShown >= gridPool().length && olderDone)) setTimeout(() => io.observe(sentinel), 600);
  }, { root: v, rootMargin: '120px' });
  io.observe(sentinel);
}

// One followed auge at a time: pick it from the strip, see everything about it below.
let followingSel = null;
function followingView(v) {
  const list = STORIES.filter(s => followed.has(s.id));
  if (!list.some(s => s.id === followingSel)) followingSel = list[0]?.id ?? null;

        <div class="followed-head rise"><div class="title" style="font-size:24px">#${s.tag}</div><button class="unfollow" data-unfollow="${s.id}">Dejar de seguir</button></div>
        <div class="meta rise" ${d(40)}>${s.region} · ${s.clustered} fuentes · hace ${timeAgo(s.updatedAt)}</div>
        <div class="lead rise" ${d(80)}>${s.brief}</div>
        ${mediaHtml(s, 120)}
        <div class="section rise" ${d(160)}>EL INFORME</div>
        ${factsHtml(s.facts, 180)}

      <div class="detail"><div class="empty rise"><div class="lead">Aún no sigues ningún auge.</div>Pulsa «Seguir» en un auge y aquí lo verás con todo: informe, fotos, redes y fuentes.</div></div>`}`;
  wire(v);
  v.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { followingSel = b.dataset.pick; followingView(v); });
  v.querySelectorAll('[data-tag]').forEach(b => b.onclick = e => { e.stopPropagation(); openTag(b.dataset.tag); });
  v.querySelectorAll('[data-unfollow]').forEach(b => b.onclick = () => { toggleFollow(b.dataset.unfollow); followingView(v); });
  v.querySelectorAll('[data-media]').forEach(b => b.onclick = () => openLightbox(s, +b.dataset.media));
}

}

const SUPABASE_URL = 'https://yypfwoviqsaijircsyxp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QaurW9Ruhj3Zuo03IXtK2A_qracBJ3R';
/** Stories come from outlets' feeds: treat all their text as text, never as HTML. */
const escHtml = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const safeStory = r => ({
  ...r,
  tag: escHtml(r.tag), brief: escHtml(r.brief), region: escHtml(r.region),
  facts: (r.facts || []).map(x => ({ ...x, text: escHtml(x.text) })),
  sources: (r.sources || []).map(x => ({ ...x, name: escHtml(x.name) })),
  topics: (r.topics || []).map(escHtml),
  media: (r.media || []).map(m => ({ ...m, caption: escHtml(m.caption), credit: escHtml(m.credit), title: escHtml(m.title) })),
  pulse: r.pulse || null,
  updatedAt: new Date(r.updated_at),
  timeline: (r.timeline || []).map(t => ({ at: new Date(t.at), text: escHtml(t.text) })),
});
const loadLive = () => fetch(`${SUPABASE_URL}/rest/v1/stories?select=*&active=eq.true&lang=eq.${edition}&order=heat.desc&limit=60`, { headers: { apikey: SUPABASE_KEY } })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(rows => { if (!rows.length) throw new Error('empty');
    return rows.map(safeStory); });
const loadBundled = () => fetch('../src/app/core/stories.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(raw => raw.map(({ minutesAgo, timeline, ...s }) => ({ ...s, updatedAt: new Date(Date.now() - minutesAgo * 60000),
      timeline: timeline.map(t => ({ at: new Date(Date.now() - t.minutesAgo * 60000), text: t.text })) })));
const loadStories = () => loadLive().catch(loadBundled).then(list => { STORIES = list.sort((a, b) => b.heat - a.heat); });
loadStories()
  .then(() => {
    push(feedView);
    // One "última hora" alert per launch for the hottest auge.
    setTimeout(() => prefs.notifyBreaking && notify(`Auge! · #${STORIES[0].tag}`, STORIES[0].brief, STORIES[0].id), 1800);
  });
