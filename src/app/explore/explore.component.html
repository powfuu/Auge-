<GridLayout rows="auto, auto, *" class="screen" androidOverflowEdge="none,cutout" (layoutChanged)="onLayout($event)">
  <StackLayout row="0">
    <Label text="Todos los auges" class="tab-title"></Label>
    <!-- Legend: what the big number means. -->
    <GridLayout columns="auto, *" class="legend" (loaded)="rise($event, 0)">
      <Label col="0" text="&#xe80e;" class="mi legend-icon"></Label>
      <StackLayout col="1">
        <Label text="Índice de auge, de 0 a 100" class="legend-title"></Label>
        <Label text="El anillo se llena según cuánto crece el tema ahora en medios y lectores. 100 = lo que más arde; los que laten están al rojo vivo." class="muted legend-text" textWrap="true"></Label>
      </StackLayout>
    </GridLayout>
  </StackLayout>

  <!-- Category filter -->
  <ScrollView row="1" orientation="horizontal" scrollBarIndicatorVisible="false" class="filters">
    <StackLayout orientation="horizontal">
      <Label text="Todos" class="chip" [class.chip-on]="!category()" (tap)="category.set(null)"></Label>
      @for (c of categories; track c.id) {
        <Label [text]="c.label" class="chip" [class.chip-on]="category() === c.id" (tap)="category.set(c.id)"></Label>
      }
    </StackLayout>
  </ScrollView>

  <ScrollView row="2" (scroll)="onScroll($event)">
    <StackLayout>
    <FlexboxLayout flexWrap="wrap" class="grid">
      @for (s of filtered(); track s.id; let i = $index) {
        <GridLayout rows="auto, *, auto" [width]="tile()" [height]="tile()" class="tile" (loaded)="rise($event, i * 40)" (tap)="open($event, s)">
          <!-- Anillo de auge: circular photo wrapped by an arc whose length is the heat index. -->
          <GridLayout row="0" columns="auto, *">
            @if (s.image) {
              <GridLayout col="0" width="52" height="52" (loaded)="ring($event, s.heat, i)">
                <SVGView [src]="ringSvg(s.heat)" width="52" height="52"></SVGView>
                <StackLayout width="44" height="44" borderRadius="22" class="ring-photo" (loaded)="shimmer($event)"></StackLayout>
                @if (s.image) {
                  <Image [src]="s.image" width="44" height="44" borderRadius="22" stretch="aspectFill" loadMode="async" (loaded)="fadeIn($event)"></Image>
                }
              </GridLayout>
            }
            <StackLayout col="1" class="ring-num" verticalAlignment="center">
              <Label [text]="s.heat.toString()" class="ring-value" [color]="s.heat >= 75 ? '#ff3b30' : s.heat >= 50 ? '#ff9500' : null"></Label>
              <Label text="AUGE" class="ring-label"></Label>
            </StackLayout>
          </GridLayout>
          <Label row="1" [text]="'#' + s.tag" class="tile-tag" textWrap="true" maxLines="2" verticalAlignment="bottom"></Label>
          <Label row="2" [text]="s.region" class="tile-region"></Label>
          @if (followed().has(s.id)) {
            <Label row="0" text="&#xe866;" class="mi followed-badge" horizontalAlignment="right" verticalAlignment="top"></Label>
          }
        </GridLayout>
      } @empty {
        <Label text="Nada en auge en este tema ahora mismo." class="muted end" width="100%"></Label>
      }
    </FlexboxLayout>
    <ActivityIndicator [busy]="loadingMore()" class="feed-more" color="#ff3b30"></ActivityIndicator>
    </StackLayout>
  </ScrollView>
</GridLayout>
