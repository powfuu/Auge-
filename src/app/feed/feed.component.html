<!-- One screen at a time on every device; on tablets and dual screens the column keeps a comfortable reading width. -->
<GridLayout rows="*" columns="*" class="screen" androidOverflowEdge="none,cutout" (loaded)="onLoaded()" (layoutChanged)="onLayout($event)">
  <GridLayout col="0" rows="auto, *" [maxWidth]="layout.wide() ? 640 : null" horizontalAlignment="center" width="100%">
    <!-- Header -->
    <GridLayout row="0" rows="auto, auto" columns="*, auto" class="header" (loaded)="rise($event, 0)">
      <StackLayout row="0" col="0">
        <Label [text]="today" class="eyebrow"></Label>
        <StackLayout orientation="horizontal">
          <Label text="Auge" class="brand"></Label>
          <Label text="!" class="brand bang" (loaded)="bang($event)"></Label>
        </StackLayout>
      </StackLayout>
      <!-- Audio summary, top-right -->
      <StackLayout row="0" col="1" orientation="horizontal" class="listen-btn" verticalAlignment="top" [visibility]="brief.playing() && brief.kicker() === 'Escuchar Auges' ? 'collapse' : 'visible'" (tap)="listenTap($event)">
        <Label text="&#xe037;" class="mi listen-icon"></Label>
        <Label text="Escuchar Auges" class="listen-label"></Label>
      </StackLayout>
      <GridLayout row="1" col="0" colSpan="2" columns="*" class="live">
      <StackLayout col="0" orientation="horizontal">
        <GridLayout width="8" height="8" verticalAlignment="center">
          <Label class="dot ping" (loaded)="pulse($event)"></Label>
          <Label class="dot"></Label>
        </GridLayout>
        <Label text="En auge ahora" class="muted live-text"></Label>
      </StackLayout>
      </GridLayout>
    </GridLayout>

    <!-- Feed -->
    <PullToRefresh row="1" class="ptr" (refresh)="onRefresh($event)">
    <ScrollView (scroll)="onScroll($event)" (loaded)="scrollerReady($event)">
      <StackLayout class="feed">
        @if (showChanges() && changes().length) {
          <StackLayout class="changes" (loaded)="rise($event, 80)">
            <GridLayout columns="*, auto">
              <Label col="0" [text]="'¿QUÉ CAMBIÓ? · ' + changes().length + ' desde tu última visita'" class="changes-title"></Label>
              <Label col="1" text="✕" class="muted" (tap)="showChanges.set(false)"></Label>
            </GridLayout>
            @for (c of changes().slice(0, 4); track c.text) {
              <Label class="change" textWrap="true" (tap)="open($event, c.story)">
                <FormattedString>
                  <Span [text]="'#' + c.story.tag + '  '" class="change-tag"></Span>
                  <Span [text]="c.text"></Span>
                </FormattedString>
              </Label>
            }
          </StackLayout>
        }
        @for (s of stories(); track s.id; let i = $index) {
          <!-- A post, X style: heat ring as avatar, tag + time as the name line, brief as the text, action row. -->
          <GridLayout columns="48, *" class="post-card"
                      (loaded)="rise($event, 120 + i * 90)" (tap)="open($event, s)">
            @if (s.image) {
              <GridLayout col="0" width="48" height="48" verticalAlignment="top" (loaded)="ringIn($event, s.heat, i)">
                <SVGView [src]="ringSvg(s.heat)" width="48" height="48"></SVGView>
                <StackLayout width="42" height="42" borderRadius="21" class="ring-photo" (loaded)="shimmer($event)"></StackLayout>
                @if (s.image) {
                  <Image [src]="s.image" width="42" height="42" borderRadius="21" stretch="aspectFill" loadMode="async" (loaded)="fadeIn($event)"></Image>
                }
              </GridLayout>
              <Label col="0" [text]="(i + 1).toString()" class="rank-chip" horizontalAlignment="right" verticalAlignment="top"></Label>
            } @else {
              <!-- No photo: no circle, just the rank, big and quiet. -->
              <StackLayout col="0" verticalAlignment="top" horizontalAlignment="center" class="rank-solo">
                <Label [text]="(i + 1).toString()" class="rank-bubble" horizontalAlignment="center"></Label>
                <GridLayout columns="*" class="rank-heat-track" horizontalAlignment="center">
                  <StackLayout class="heat-fill" horizontalAlignment="left" [width]="(30 * s.heat) / 100"></StackLayout>
                </GridLayout>
              </StackLayout>
            }

            <StackLayout col="1" class="post-main">
              <Label [text]="'#' + s.tag" class="post-name" textWrap="true"></Label>
              <StackLayout orientation="horizontal">
                <SVGView [src]="iconSvg('auge', true, '#ff3b30')" width="13" height="13" verticalAlignment="center"></SVGView>
                <Label class="post-sub">
                  <FormattedString>
                    <Span [text]="' ' + s.heat" class="heat-info"></Span>
                    <Span [text]="' · ' + s.region + ' · ' + timeAgo(s.updatedAt)"></Span>
                  </FormattedString>
                </Label>
              </StackLayout>
              <Label [text]="s.brief" class="post-body" textWrap="true"></Label>
              <GridLayout columns="auto, *" class="actions">
                <StackLayout col="0" orientation="horizontal" class="act" (tap)="follow($event, s)">
                  <SVGView [src]="iconSvg('following', followed().has(s.id), followed().has(s.id) ? '#ff3b30' : null)" width="16" height="16"></SVGView>
                  <Label [text]="followed().has(s.id) ? 'Siguiendo' : 'Seguir'" class="act-label act-follow" [class.act-on]="followed().has(s.id)"></Label>
                </StackLayout>
                <StackLayout col="1" class="act" horizontalAlignment="right" (tap)="share($event, s)">
                  <SVGView [src]="shareSvg()" width="16" height="16"></SVGView>
                </StackLayout>
              </GridLayout>
            </StackLayout>
          </GridLayout>
        } @empty {
          <Label text="Nada en auge en tus temas ahora mismo. Cambia tus temas en Perfil → Ajustes." class="muted end" textWrap="true"></Label>
        }
        <ActivityIndicator [busy]="loadingMore()" class="feed-more" color="#ff3b30"></ActivityIndicator>
      </StackLayout>
    </ScrollView>
    </PullToRefresh>
  </GridLayout>

</GridLayout>
